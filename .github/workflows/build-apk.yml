name: Build Android APK

# Runs automatically on every push to main, and can also be started by hand
# from the Actions tab (the "Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate the Android project files
        working-directory: app
        run: flutter create .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:3000' }}

      - name: Save the APK as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: timetracker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TimeTracker APK (build ${{ github.run_number }})
          files: app/build/app/outputs/flutter-apk/app-release.apk
